<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer{
            width: 200px;
            height: 100px;
            /* border: size style color */
            border: 1px solid black;
        }

        #rem{
            width: 5rem;
            height: 5rem;
            background-color: black;
        }
        #parent{
            width: 500px;
            height: 500px;
            background-color: pink;
            font-size: 20px;
        }
        #child{
            width: 5em;
            height: 5em;
            background-color: blue;
            border: 1px solid black;
        }
        #viewport{
            width: 50vw;
            height: 50vh;
            background-color: orange;
        }
        #container{
            height: 70%;
            width: 70%;
            background-color: purple;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Height, weight and Border in CSS</h1>

    <div id="outer" style="background-color: red;">
        <p>Samrat Babu Joshi</p>
    </div>
    <hr>
    <h1>Unit in CSS</h1>
    <h2>Absolute Unit</h2>
    <!-- fixed unit - eg px, inch, mm, cm, m, feet -->

    <h2>Relative Unit</h2>
    <!-- Unit that does not have fixed size.
    Eg. rem, em, vh, vw, %
    
    rem - reference font size of root/ default font size
    em - reference font size of parent element
    vh - viewpoint height means screen height.
    100vh means 100% height of the screen.
    vw - viewpoint width means screen width. 100
    vw means 100%width of the screen.
    % - reference size of the parent element.
    -->

    <h3>rem</h3>
    <div id="rem">

    </div>
    <hr>
    <p>em</p>
    <div id="parent">
        <div id="child"></div>
    </div>
    <p>vh and vw</p>
    <div id="viewport">

    </div>
    <!-- 70% width and height container usin div tag and container as its id selector. give it bblack border of 1px -->
    <p>container</p>
    <div id="container">
        <p>references ize of the parent element</p>
    </div>
</body>
</html>
