<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .navbar{
            width: 100%;
            height: 10vh;
            background-color: green;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .navlinks{
            display: flex;
            gap: 50px;
            list-style-type: none;
            font-size: 18px;
        }
        a{
            color: white;
            text-decoration: none;
        }
        .logo{
            font-size: 36px;
            color: white;
        }
        .searchbutton{
            display: flex;
            gap: 10px

        }
        .searchbutton input{
            padding: 4px 8px;

        }
        .searchbutton button{
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Samrat Babu Joshi
        </div>
        <ul class="navlinks">
        <li><a href="">Home</a></li>
        <li><a href="">Service</a></li>
        <li><a href="">About Us</a></li>
        <li><a href="">Contact</a></li>
        </ul>

        <div class="searchbutton">
            <input type="search" name="" id="" placeholder="Search">
            <button class="login">Login</button>

        </div>
    </nav>
</body>
</html>
