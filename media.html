<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Media in HTML</h1>
    <h2>Audio</h2>
    <audio src="../Media/SAMJHERA - THE EDGE BAND ( OFFICIAL MUSIC VIDEO).mp4" controls preload="auto"></audio>
    <audio src="../Media/SAMJHERA - THE EDGE BAND ( OFFICIAL MUSIC VIDEO).mp4" controls preload="metadata"></audio>
    <audio src="../Media/SAMJHERA - THE EDGE BAND ( OFFICIAL MUSIC VIDEO).mp4" controls preload="none"></audio>
    <h2>Video</h2>
    <video src="../Media/SAMJHERA - THE EDGE BAND ( OFFICIAL MUSIC VIDEO).mp4" controls loop muted poster="../IMAGE/Screenshot 2026-03-13 214322.png"></video>

    <h2>iFrame</h2>
    <h3>Youtube Video</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/aKOdeinJT6s?si=pNY6tT5Kb8vgKlam" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h3>Google Map</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.365282178406!2d85.33133927532369!3d27.70600587618326!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb19a000ac6259%3A0x9d9f16732861e650!2sMaitidevi%20Temple!5e0!3m2!1sen!2snp!4v1786073447953!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <h3>Website</h3>
    <iframe src="https://www.lbef.org/" frameborder="0" width="800px" height="500px"></iframe>
    <!-- 
    controls - gives controls options like play payse/ volume
    autoplay - auto play the media when loaded
    loop - repeats the media
    muted - media is muted by default
    poster - adds thumnail in the video

    suto: loads all the file info when site is loaded
    metadata: Loads only file info like name author, size. not the exact media file until and unless media is played
    none: loads nothing, until and unless media is played
    -->
</body>
</html>
