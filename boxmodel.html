<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px black solid;
            
        }
        #box2{
            height: 200px;
            width: 400px;
            border: 1px solid black;
            background-color: yellow;
            padding: 50px
        }
        #box3{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px solid black;
            padding: 100px 50px;
        }
        #box4{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px solid black;
            padding: 50px 40px 30px 20px;
        }
        #box5{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px solid black;
            margin: 50px;
        }
        #box6{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px solid black;
            margin: 80px 40px;
            /* top-left bottom-right */
        }
        #box7{
            height: 200px;
            width: 400px;
            background-color: yellow;
            border: 1px solid black;
            margin: 150px 50px 100px 200px;
        }
    </style>
</head>
<body>
    <h1>Box Model</h1>
    <p id="box">
        Bikul Raj Koirala

    </p>
    <p id="box2">

        Bikul Raj Koirala
    </p>
    <!-- 
    Padding :
    padding is the space between the element and its border.
    Syntax:
    padding: allsides;
    padding: top-bottom left-right;
    padding: top-rigth bottom left;
    -->
    <!-- top bottom, left-right -->
    <p id="box3">Marker</p>
    <!-- top right bottom left: 50 40 30 10 -->
    <p id="box4">Bikul Sir Marker</p>
    <h1>Margin</h1>
    <!-- 
    Margin:
    It is the space outside the border of the element. Margin set the space between the elements 

    Syntax:
    margin: allside;
    margin: top -bottom left-right;
    margin: top right bottom left;
    -->
    <p id="box5">Chocolate Cake</p>

    <p id="box6">Red Velvet</p>

    <p id="box7">Vanila Cake</p>
</body>
</html>
