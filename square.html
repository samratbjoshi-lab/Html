<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square{
            width: 100px;
            height: 100px;
            background-color: orange;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .circle{
            width: 100px;
            height: 100px;
            border-radius: 100%;
            background-color: orange;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .parent{
            width: 500px;
            height: 300px;
            background-color: orange;
            display: flex;
            justify-content: space-around;
            align-items: center;
        
        }
        .child{
            width: 100px;
            height: 100px;
            background-color: black;
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <div class="square">
        Square
    </div>
    <br><br>
    <div class="circle">
        Circle
    </div>
    <br><br>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>

    

</body>
</html>
