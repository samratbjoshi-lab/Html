<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 500px;
            width: 800px;
            border: 1px solid black;
            display: flex;
        }
        .child{
            height: 100px;
            width: 100px;
            border: 1px solid black;

        }
    </style>
</head>
<body>
    <h1>Flexbox Day 3</h1>
    <p>Flex Direction</p>
    <p>Justify-Content</p>
    <p>Aligh-items</p>
    <p>Flex-wrap</p>
    <p>Align-Content</p>
    <p>Order</p>
    <p>Align-self</p>
    <p>Flex- Grow</p>
    <!-- 
    For 
    -->
    <div class="parent">
    <div class="child" style="flex-grow: 0;">1</div>
    <div class="child" style="flex-grow: 1;"></div>
    <div class="child" style="flex-grow: 2;"></div>
    <div class="child">4</div>
    <div class="child">5</div>
    </div>


    <p>Flex- Shink</p>
    <div class="parent">
        <div class="child" style="flex-shrink: 0;">1</div>
        <div class="child"style="flex-shrink: 1;">2</div>
        <div class="child" style="flex-shrink: 2;">3</div>
        <div class="child"style="flex-shrink: 3;">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
        <div class="child">9</div>
    </div>
    
    
</body>
</html>
